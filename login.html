<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đăng nhập | Bách Sơn Tửu</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>


    <main class="login-page">


        <div class="login-container">


            <!-- ==============================
                 TIÊU ĐỀ
            =============================== -->

            <div class="login-header">

                <h1>
                    Đăng nhập
                </h1>

                <p>
                    Đăng nhập để quản lý đơn hàng của bạn
                </p>

            </div>


            <!-- ==============================
                 FORM ĐĂNG NHẬP
            =============================== -->

            <form
                id="loginForm"
                class="login-form"
            >


                <!-- TÀI KHOẢN -->

                <div class="form-group">

                    <label for="loginContact">
                        Email hoặc số điện thoại
                    </label>

                    <input
                        type="text"
                        id="loginContact"
                        name="contact"
                        placeholder="Nhập Email hoặc số điện thoại"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- MẬT KHẨU -->

                <div class="form-group">

                    <label for="loginPassword">
                        Mật khẩu
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Nhập mật khẩu"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- NÚT ĐĂNG NHẬP -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Đăng nhập
                </button>


                <!-- THÔNG BÁO -->

                <div
                    id="loginMessage"
                    class="login-message"
                ></div>


            </form>


            <!-- ==============================
                 ĐĂNG KÝ
            =============================== -->

            <div class="login-register">

                Chưa có tài khoản?

                <a href="register.html">
                    Đăng ký
                </a>

            </div>


        </div>


    </main>


    <!-- =====================================
         SUPABASE
    ====================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>


</body>

</html>
